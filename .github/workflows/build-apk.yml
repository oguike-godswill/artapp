name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build APK
        working-directory: ./app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solis-app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Solis Art App v1.0.1 (Android Connectivity & Auth Fix)
          draft: false
          prerelease: false
          body: |
            ### 🎨 Solis Mobile App v1.0.1 (Android APK)

            Directly installable APK for Android devices.

            #### What's New in v1.0.1:
            - **Seamless Android Connectivity**: Solis now defaults to a high-speed cloud endpoint for real physical devices, avoiding emulator timeout errors.
            - **Server Connection Manager**: Interactive bottom sheet on Welcome, Login, and Profile screens to test ping and switch between Cloud Tunnel, Local Wi-Fi (`192.168.100.25`), Emulator (`10.0.2.2`), and custom hosts.
            - **Instant Authentication & Error Recovery**: 15s timeout with direct in-app recovery button if server is unreachable.
            - **Bypass Headers**: Transparent bypass for tunnel security prompts.
            - **Interactive 3D Pavilion Map, Holographic Card, Live WebSocket Bidding, & Audio Guide**.
          files: app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
