name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build APK
        working-directory: ./app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solis-app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Solis Art App v1.0.2 (Global Cloud Tunnel Default)
          draft: false
          prerelease: false
          body: |
            ### 🎨 Solis Mobile App v1.0.2 (Android APK)

            Directly installable APK for Android devices.

            #### What's New in v1.0.2:
            - **Global Cloud Tunnel Default (`http://bore.pub:38400`)**: Connect anywhere from cellular (4G/5G) or any outside Wi-Fi network with zero latency and no local configuration required.
            - **Seamless Authentication**: Login and registration work out of the box anywhere.
            - **Server Connection Manager**: Switch endpoints anytime between Global Cloud, Local Wi-Fi, and Emulator with live ping test.
          files: app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
